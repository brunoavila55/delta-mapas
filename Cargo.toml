[package]
name = "delta-analysis"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Prova de processamento geoespacial do novo SaaS"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
geo = "0.32"
geographiclib-rs = { version = "0.2.7", default-features = false }
geojson = { version = "0.24", features = ["geo-types"] }
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"
pdf-writer = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shapefile = { version = "0.9", features = ["geo-types", "encoding_rs"] }
encoding_rs = "0.8"
proj4rs = "0.1"
proj4wkt = "0.1"
unicode-normalization = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
rand = "0.8"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
tiff = "0.11"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
