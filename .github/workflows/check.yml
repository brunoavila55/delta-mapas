name: Rust checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Install browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Frontend browser tests
        run: npm test --prefix frontend
      - name: Install pinned toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Prepare isolated PostgreSQL
        run: |
          python3 scripts/setup-dev.py
          docker compose up -d --wait postgres
      - name: Account isolation and durable queue
        run: scripts/test-saas.sh
      - name: Container smoke test
        run: |
          docker build -t delta-analysis:test .
          docker run --rm delta-analysis:test demo --area examples/talhao.geojson --output /data/demo
      - name: Cleanup development database
        if: always()
        run: docker compose down --volumes
