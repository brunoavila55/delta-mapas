{% load web_tags %}
{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Paginação">
  <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  <div>
    {% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}" hx-get="{% querystring page=page_obj.previous_page_number %}" hx-target="{{ hx_target }}" hx-swap="outerHTML">← Anterior</a>{% endif %}
    {% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}" hx-get="{% querystring page=page_obj.next_page_number %}" hx-target="{{ hx_target }}" hx-swap="outerHTML">Próxima →</a>{% endif %}
  </div>
</nav>
{% endif %}
