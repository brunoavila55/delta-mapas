name: delta-mapas

x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-local-development-key-change-this-value}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,.localhost,backend}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://localhost:5173}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  POSTGRES_DB: ${POSTGRES_DB:-delta_maps}
  POSTGRES_USER: ${POSTGRES_USER:-delta_maps}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delta_maps_local}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  MINIO_STORAGE_ENABLED: "true"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-delta_maps}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-delta_maps_local_secret}
  MINIO_BUCKET: ${MINIO_BUCKET:-delta-mapas}
  MINIO_USE_SSL: "false"
  COPERNICUS_STAC_URL: ${COPERNICUS_STAC_URL:-https://stac.dataspace.copernicus.eu/v1/}
  COPERNICUS_STAC_COLLECTION: ${COPERNICUS_STAC_COLLECTION:-sentinel-2-l2a}
  COPERNICUS_STAC_TIMEOUT_SECONDS: ${COPERNICUS_STAC_TIMEOUT_SECONDS:-30}
  COPERNICUS_STAC_MAX_ITEMS: ${COPERNICUS_STAC_MAX_ITEMS:-100}
  COPERNICUS_STAC_MAX_RETRIES: ${COPERNICUS_STAC_MAX_RETRIES:-2}
  COPERNICUS_STAC_RETRY_DELAY_SECONDS: ${COPERNICUS_STAC_RETRY_DELAY_SECONDS:-15}

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delta_maps}
      POSTGRES_USER: ${POSTGRES_USER:-delta_maps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delta_maps_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delta_maps} -d ${POSTGRES_DB:-delta_maps}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-delta_maps}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-delta_maps_local_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  minio_init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-delta_maps}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-delta_maps_local_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-delta-mapas}
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set none local/$$MINIO_BUCKET;
      "
    restart: "no"

  backend:
    build:
      context: ./backend
    environment: *backend-environment
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
    command: celery -A delta_maps worker --loglevel=INFO --concurrency=1
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
