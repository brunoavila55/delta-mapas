name: delta-mapas

x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-local-development-key-change-this-value}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,.localhost,backend}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
  POSTGRES_DB: ${POSTGRES_DB:-delta_maps}
  POSTGRES_USER: ${POSTGRES_USER:-delta_maps}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delta_maps_local}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  DJANGO_CACHE_URL: redis://redis:6379/1
  LOGIN_IP_THROTTLE_RATE: ${LOGIN_IP_THROTTLE_RATE:-20/min}
  LOGIN_ACCOUNT_THROTTLE_RATE: ${LOGIN_ACCOUNT_THROTTLE_RATE:-5/min}
  MINIO_STORAGE_ENABLED: "true"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-delta_maps}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-delta_maps_local_secret}
  MINIO_BUCKET: ${MINIO_BUCKET:-delta-mapas}
  MINIO_USE_SSL: "false"
  COPERNICUS_STAC_URL: ${COPERNICUS_STAC_URL:-https://stac.dataspace.copernicus.eu/v1/}
  COPERNICUS_STAC_COLLECTION: ${COPERNICUS_STAC_COLLECTION:-sentinel-2-l2a}
  COPERNICUS_STAC_TIMEOUT_SECONDS: ${COPERNICUS_STAC_TIMEOUT_SECONDS:-30}
  COPERNICUS_STAC_MAX_ITEMS: ${COPERNICUS_STAC_MAX_ITEMS:-100}
  COPERNICUS_STAC_MAX_RETRIES: ${COPERNICUS_STAC_MAX_RETRIES:-2}
  COPERNICUS_STAC_RETRY_DELAY_SECONDS: ${COPERNICUS_STAC_RETRY_DELAY_SECONDS:-15}
  COPERNICUS_CLIENT_ID: ${COPERNICUS_CLIENT_ID:-}
  COPERNICUS_CLIENT_SECRET: ${COPERNICUS_CLIENT_SECRET:-}
  COPERNICUS_TOKEN_URL: ${COPERNICUS_TOKEN_URL:-https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token}
  COPERNICUS_PROCESS_URL: ${COPERNICUS_PROCESS_URL:-https://sh.dataspace.copernicus.eu/process/v1}
  COPERNICUS_AUTH_TIMEOUT_SECONDS: ${COPERNICUS_AUTH_TIMEOUT_SECONDS:-30}
  COPERNICUS_AUTH_MAX_RESPONSE_BYTES: ${COPERNICUS_AUTH_MAX_RESPONSE_BYTES:-65536}
  COPERNICUS_PROCESS_TIMEOUT_SECONDS: ${COPERNICUS_PROCESS_TIMEOUT_SECONDS:-300}
  COPERNICUS_TOKEN_REFRESH_LEEWAY_SECONDS: ${COPERNICUS_TOKEN_REFRESH_LEEWAY_SECONDS:-60}
  COPERNICUS_PROCESS_MAX_RETRIES: ${COPERNICUS_PROCESS_MAX_RETRIES:-2}
  COPERNICUS_PROCESS_RETRY_DELAY_SECONDS: ${COPERNICUS_PROCESS_RETRY_DELAY_SECONDS:-30}
  COPERNICUS_OUTPUT_RESOLUTION_METERS: ${COPERNICUS_OUTPUT_RESOLUTION_METERS:-10}
  COPERNICUS_MAX_OUTPUT_PIXELS: ${COPERNICUS_MAX_OUTPUT_PIXELS:-25000000}
  COPERNICUS_MAX_DOWNLOAD_BYTES: ${COPERNICUS_MAX_DOWNLOAD_BYTES:-536870912}
  COPERNICUS_SCENE_TIME_TOLERANCE_SECONDS: ${COPERNICUS_SCENE_TIME_TOLERANCE_SECONDS:-300}
  COPERNICUS_STAC_MAX_RESPONSE_BYTES: ${COPERNICUS_STAC_MAX_RESPONSE_BYTES:-2097152}
  COPERNICUS_STAC_MAX_TOTAL_BYTES: ${COPERNICUS_STAC_MAX_TOTAL_BYTES:-8388608}
  GEOMETRY_MAX_COORDINATES: ${GEOMETRY_MAX_COORDINATES:-100000}
  GEOMETRY_MAX_COMPONENTS: ${GEOMETRY_MAX_COMPONENTS:-1000}
  GEOMETRY_MAX_NESTING_DEPTH: ${GEOMETRY_MAX_NESTING_DEPTH:-8}
  MAP_RENDER_MAX_DIMENSION_PIXELS: ${MAP_RENDER_MAX_DIMENSION_PIXELS:-2400}
  MAP_RENDER_PNG_DPI: ${MAP_RENDER_PNG_DPI:-180}
  MAP_RENDER_PDF_DPI: ${MAP_RENDER_PDF_DPI:-150}
  MAP_JOB_STALE_MINUTES: ${MAP_JOB_STALE_MINUTES:-120}
  MAP_RECONCILIATION_ENABLED: ${MAP_RECONCILIATION_ENABLED:-false}
  MAP_RECONCILIATION_INTERVAL_SECONDS: ${MAP_RECONCILIATION_INTERVAL_SECONDS:-900}
  MAP_RECONCILIATION_APPLY_STALLED: ${MAP_RECONCILIATION_APPLY_STALLED:-true}
  MAP_RECONCILIATION_DELETE_ORPHANS: ${MAP_RECONCILIATION_DELETE_ORPHANS:-false}
  OPERATIONS_ALERT_WEBHOOK_URL: ${OPERATIONS_ALERT_WEBHOOK_URL:-}
  OPERATIONS_ALERT_WEBHOOK_SECRET: ${OPERATIONS_ALERT_WEBHOOK_SECRET:-}
  OPERATIONS_ALERT_TIMEOUT_SECONDS: ${OPERATIONS_ALERT_TIMEOUT_SECONDS:-10}
  OPERATIONS_ALERT_COOLDOWN_SECONDS: ${OPERATIONS_ALERT_COOLDOWN_SECONDS:-21600}
  OPERATIONS_ALERT_ALLOW_INSECURE_HTTP: ${OPERATIONS_ALERT_ALLOW_INSECURE_HTTP:-false}
  MPLCONFIGDIR: ${MPLCONFIGDIR:-/tmp/matplotlib}

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delta_maps}
      POSTGRES_USER: ${POSTGRES_USER:-delta_maps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delta_maps_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delta_maps} -d ${POSTGRES_DB:-delta_maps}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-delta_maps}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-delta_maps_local_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  minio_init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-delta_maps}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-delta_maps_local_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-delta-mapas}
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set none local/$$MINIO_BUCKET;
      "
    restart: "no"

  backend:
    build:
      context: ./backend
    environment: *backend-environment
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
    command: celery -A delta_maps worker --loglevel=INFO --concurrency=1
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
    command: celery -A delta_maps beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    restart: unless-stopped

  backup:
    profiles: ["ops"]
    build:
      context: ./ops/backup
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-delta_maps}
      POSTGRES_USER: ${POSTGRES_USER:-delta_maps}
      PGPASSWORD: ${POSTGRES_PASSWORD:-delta_maps_local}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-delta_maps}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-delta_maps_local_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-delta-mapas}
      APP_VERSION: ${APP_VERSION:-local}
      BACKUP_SIGNING_KEY: ${BACKUP_SIGNING_KEY:-unsafe-local-backup-signing-key}
      BACKUP_ENVIRONMENT: ${BACKUP_ENVIRONMENT:-local}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_DIRECTORY:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  redis_data:
  minio_data:
